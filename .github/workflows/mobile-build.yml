name: Mobile builds
on:
  push:
    branches: [main, codex/native-app-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      THREAD_TEST_KEYSTORE: ${{ github.workspace }}/android/app/thread-test.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run sync:mobile
      - name: Reuse Android test signing key
        id: test-signing
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.THREAD_TEST_KEYSTORE }}
          key: thread-android-debug-signing-v2
      - name: Create a test signing key only when none was restored
        shell: bash
        run: |
          if [ ! -f "$THREAD_TEST_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$THREAD_TEST_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$THREAD_TEST_KEYSTORE"
      - name: Build Android test APK and unsigned release bundle
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug bundleRelease
      - name: Preserve Android test signing key before emulator diagnostics
        if: steps.test-signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.THREAD_TEST_KEYSTORE }}
          key: thread-android-debug-signing-v2
      - uses: actions/upload-artifact@v4
        with:
          name: THREAD-Android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: THREAD-Android-unsigned-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installed app opens offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Direct SwiftShader GLES disconnects the emulator during the canvas test.
          # Use ANGLE over SwiftShader while retaining every installed-app check.
          # https://developer.android.com/studio/run/emulator-acceleration
          emulator-options: -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            bash android/gradlew -p android --no-daemon :app:connectedDebugAndroidTest
            adb pull /sdcard/Download/thread-paused.png android-paused.png
            adb pull /sdcard/Download/thread-leaderboard.png android-leaderboard.png
            adb pull /sdcard/Download/thread-today.png android-today.png
            adb pull /sdcard/Download/thread-achievements.png android-achievements.png
            adb pull /sdcard/Download/thread-milestone.png android-milestone.png
            adb pull /sdcard/Download/thread-previous-renderer.png android-previous-renderer.png
            adb pull /sdcard/Download/thread-cached-renderer.png android-cached-renderer.png
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.onethumbarcade.thread/.MainActivity
            python3 scripts/capture-android-launch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREAD-Android-launch-check
          path: |
            android-launch.png
            android-paused.png
            android-leaderboard.png
            android-today.png
            android-achievements.png
            android-milestone.png
            android-previous-renderer.png
            android-cached-renderer.png
            android/app/build/reports/androidTests/connected/debug/
            android/app/build/outputs/androidTest-results/connected/debug/
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select installed Xcode 26 or later
        run: |
          python3 - <<'PY'
          import glob, re, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              match = re.search(r'Xcode_(\d+)(?:\.(\d+))?', app)
              if match and int(match[1]) >= 26 and 'beta' not in app.lower():
                  candidates.append(((int(match[1]), int(match[2] or 0)), app))
          if candidates:
              subprocess.run(['sudo', 'xcode-select', '-s', max(candidates)[1]], check=True)
          subprocess.run(['xcodebuild', '-version'], check=True)
          PY
      - run: npm ci
      - run: npm run sync:mobile
      - name: Build iOS simulator app without signing
        run: |
          if ! xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build > ios-build.log 2>&1; then
            tail -n 100 ios-build.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: THREAD-iOS-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: THREAD-iOS-build-log
          path: ios-build.log
