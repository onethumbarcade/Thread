<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="theme-color" content="#050b1b" />
    <title>THREAD — One Thumb Arcade</title>
    <style>
      *{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#050b1b;color:#fff;font-family:Inter,ui-rounded,system-ui,sans-serif;touch-action:none;user-select:none}.game{position:fixed;inset:0;overflow:hidden;background:#050b1b}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;inset:0 0 auto;padding:max(14px,env(safe-area-inset-top)) 18px 28px;background:linear-gradient(#030a1ce8 0%,#030a1ca8 55%,transparent 100%);pointer-events:none}.brand{color:#ffd447;font-size:21px;font-weight:1000;font-style:italic;letter-spacing:5px;text-shadow:0 0 18px #ffd44755}.meters{position:absolute;right:18px;top:max(13px,env(safe-area-inset-top));display:flex;gap:14px;text-align:right}.meters span{display:flex;flex-direction:column;color:#93b3db;font-size:10px;font-weight:800;letter-spacing:1.2px}.meters b{color:#fff;font-size:17px;line-height:1.1;letter-spacing:0}.energy{height:5px;margin-top:11px;overflow:hidden;border-radius:8px;background:#ffffff1d}.energy i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ff5470,#ffd447 35%,#55f7d5);box-shadow:0 0 10px #55f7d5}.slider{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));width:min(90vw,460px);height:104px;transform:translateX(-50%);display:flex;align-items:center;padding:0 19px;border:2px solid #ffe47c;border-radius:52px;color:#071735;background:linear-gradient(#ffe567,#f7b920);box-shadow:0 9px 0 #9b6412,0 15px 32px #0009;cursor:ew-resize}.slider span{font-size:29px;font-weight:1000;line-height:1}.slider i{flex:1;height:7px;margin:0 -5px;border-radius:8px;background:#071735}.card{position:absolute;left:50%;top:50%;width:min(88vw,390px);transform:translate(-50%,-50%);padding:30px 28px 27px;border:1px solid #7fe8e455;border-radius:32px;background:linear-gradient(160deg,#102b59ee,#07142df5);box-shadow:0 28px 80px #000c,inset 0 1px #ffffff20;text-align:center;backdrop-filter:blur(15px)}.logo{position:relative;width:76px;height:76px;margin:0 auto 17px;border:8px solid #ffd447;border-radius:50%;box-shadow:0 0 25px #ffd44788,inset 0 0 18px #ffd44755}.logo:before,.logo:after{content:"";position:absolute;left:-30px;right:-30px;top:27px;height:5px;border-radius:8px;background:#55f7d5;box-shadow:0 0 15px #55f7d5;transform:rotate(-9deg)}.logo:after{transform:rotate(11deg)}.logo i{position:absolute;inset:25px;z-index:1;border-radius:50%;background:#fff4a8;box-shadow:0 0 15px #fff}.eyebrow{margin:0 0 4px;color:#55f7d5;font-size:11px;font-weight:900;letter-spacing:3px}.card h1{margin:0;font-size:clamp(50px,15vw,72px);font-weight:1000;font-style:italic;letter-spacing:5px;line-height:.95;text-shadow:4px 5px 0 #153a68}.card>p:not(.eyebrow){margin:15px auto 19px;max-width:280px;color:#d7e6fb;font-size:16px;line-height:1.4}.card ul{display:grid;gap:9px;margin:0 0 23px;padding:16px 18px;border-radius:18px;background:#030b1e77;list-style:none;color:#aec5e5;font-size:14px;text-align:left}.card li:before{content:"•";margin-right:9px;color:#ffd447}.card li b{color:#fff}.card button{width:100%;min-height:58px;border:0;border-radius:18px;color:#071735;background:linear-gradient(#ffe56a,#f8ba20);box-shadow:0 7px 0 #9d6511;font-size:19px;font-weight:1000;letter-spacing:2px;cursor:pointer}.result h2{margin:7px 0 0;color:#ffd447;font-size:58px;line-height:1}.result span{display:block;margin:8px 0 24px;color:#aec5e5;font-weight:700}.hidden{display:none}@media(max-width:390px){.meters{gap:8px;right:10px}.meters span{letter-spacing:.5px}.meters b{font-size:14px}.brand{font-size:18px;letter-spacing:3px}.slider{width:92vw;height:94px}}
    </style>
  </head>
  <body>
    <main class="game" id="game">
      <canvas id="canvas" aria-label="Moving ring and rising path game field"></canvas>
      <header class="hud hidden" id="hud"><div class="brand">THREAD</div><div class="meters"><span>LEVEL<b id="level">1</b></span><span>RING<b id="ring">34</b></span><span>SPEED<b id="speed">1×</b></span><span>SCORE<b id="score">0</b></span></div><div class="energy"><i id="energy" style="width:100%"></i></div></header>
      <div class="slider hidden" id="slider" role="slider" aria-label="Move ring left and right"><span>◀</span><i></i><span>▶</span></div>
      <section class="card" id="start"><div class="logo"><i></i></div><p class="eyebrow">ONE-THUMB ARCADE</p><h1>THREAD</h1><p>Move the ring. Keep the glowing path running through it.</p><ul><li><b>Slide</b> to move the ring</li><li><b>Stay centered</b> to protect your energy</li><li><b>Collect gold orbs</b> to expand the ring as speed rises</li></ul><button id="play">PLAY</button></section>
      <section class="card result hidden" id="result"><p class="eyebrow">THREAD BROKEN</p><h2 id="final-score">0</h2><span id="distance">0m climbed</span><button id="again">TRY AGAIN</button></section>
    </main>
    <script>
      const NODE_GAP=86,TAU=Math.PI*2,STAGE_SCORE=20000,BGS=[["#071735","#10285a","#050b1b"],["#241044","#3d246f","#10071f"],["#07343b","#145663","#03171c"],["#431425","#713149","#1d0710"]];
      const canvas=document.querySelector("#canvas"),ctx=canvas.getContext("2d"),hud=document.querySelector("#hud"),slider=document.querySelector("#slider"),startCard=document.querySelector("#start"),result=document.querySelector("#result");
      let game,started=false,over=false,pointer=false,pointerX=0,width=innerWidth,height=innerHeight,previous=performance.now(),lastHud=0;
      function extend(nodes,target){while((nodes.length-1)*NODE_GAP<target){const i=nodes.length,d=Math.min(1.35,i/220),max=Math.min(1.08,.28+d*.66),prev=nodes[i-1]-nodes[i-2];let proposed=prev*.22+(Math.random()*2-1)*max,min=d>.35?.08+d*.12:0;if(Math.abs(proposed)<min)proposed=(Math.random()<.5?-1:1)*min;nodes.push(nodes[i-1]+Math.max(-max,Math.min(max,proposed)))}}
      function makeCourse(){const n=[0,.15];extend(n,3200);return n}function angleAt(nodes,y){const p=Math.max(0,y/NODE_GAP),i=Math.min(nodes.length-2,Math.floor(p)),t=Math.max(0,Math.min(1,p-i)),e=t*t*(3-2*t);return nodes[i]+(nodes[i+1]-nodes[i])*e}
      function fresh(){return{running:true,ringOffset:0,distance:0,score:0,ringRadius:34,energy:100,speed:54,nodes:makeCourse(),pickups:Array.from({length:24},(_,i)=>({y:420+i*540+Math.random()*180,collected:false})),flash:0}}
      function resize(){const dpr=Math.min(devicePixelRatio||1,2);width=innerWidth;height=innerHeight;canvas.width=width*dpr;canvas.height=height*dpr;canvas.style.width=width+"px";canvas.style.height=height+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
      function begin(){game=fresh();started=true;over=false;startCard.classList.add("hidden");result.classList.add("hidden");hud.classList.remove("hidden");slider.classList.remove("hidden")}document.querySelector("#play").onclick=begin;document.querySelector("#again").onclick=begin;
      function move(x){if(!pointer||!game?.running)return;const dx=x-pointerX;pointerX=x;const r=Math.min(innerWidth*.37,180);game.ringOffset=Math.max(-r,Math.min(r,game.ringOffset+dx))}slider.onpointerdown=e=>{pointer=true;pointerX=e.clientX;slider.setPointerCapture(e.pointerId)};slider.onpointermove=e=>move(e.clientX);slider.onpointerup=slider.onpointercancel=()=>pointer=false;
      function drawShape(x,y,r,shape,scale){ctx.beginPath();if(shape===0)ctx.arc(x,y,r*scale,0,TAU);else if(shape===1)ctx.ellipse(x,y,r*.78*scale,r*1.2,0,0,TAU);else{const rx=r*.66*scale,ry=r*1.12;ctx.moveTo(x,y-ry);ctx.lineTo(x+rx,y);ctx.lineTo(x,y+ry);ctx.lineTo(x-rx,y);ctx.closePath()}}
      function frame(time){const dt=Math.min(.033,(time-previous)/1000);previous=time;const g=game||fresh(),cx=width/2,ringY=Math.min(height*.59,height-230),cr=Math.min(width*.37,180),stage=Math.floor(g.score/STAGE_SCORE)+1,shape=(stage-1)%3,scale=Math.max(.76,1-(stage-1)*.025),shapeWidth=[1,.78,.66][shape]*scale;
        if(started&&g.running){extend(g.nodes,g.distance+height*2);while(g.pickups[g.pickups.length-1].y<g.distance+height*2){const y=g.pickups[g.pickups.length-1].y;g.pickups.push({y:y+520+Math.random()*220,collected:false})}g.speed=54+g.distance/105;g.distance+=g.speed*dt;const px=cx+cr*Math.sin(angleAt(g.nodes,g.distance)),rx=cx+g.ringOffset,offset=Math.abs(px-rx),safe=offset<=g.ringRadius*shapeWidth-6;if(safe){g.energy=Math.min(100,g.energy+13*dt);const precision=1-offset/Math.max(1,g.ringRadius);g.score+=(22+precision*30)*dt*(g.speed/54)}else g.energy-=Math.min(80,30+g.distance/240)*dt;g.ringRadius=Math.max(24,g.ringRadius-(.9+(g.speed/54-1)*.58)*dt);for(const p of g.pickups)if(!p.collected&&Math.abs(p.y-g.distance)<g.speed*dt+3){p.collected=true;if(safe){g.ringRadius=Math.min(72,g.ringRadius+11);g.score+=250;g.flash=1}}if(g.energy<=0){g.energy=0;g.running=false;over=true;slider.classList.add("hidden");result.classList.remove("hidden");document.querySelector("#final-score").textContent=Math.floor(g.score).toLocaleString();document.querySelector("#distance").textContent=Math.floor(g.distance/10)+"m climbed"}}
        const c=BGS[(stage-1)%BGS.length],sky=ctx.createLinearGradient(0,0,0,height);sky.addColorStop(0,c[0]);sky.addColorStop(.52,c[1]);sky.addColorStop(1,c[2]);ctx.fillStyle=sky;ctx.fillRect(0,0,width,height);for(let i=0;i<36;i++){ctx.globalAlpha=.15+(i%4)*.05;ctx.fillStyle="#a6deff";ctx.beginPath();ctx.arc((i*91)%width,(((i*137-g.distance*.18)%height)+height)%height,1+i%2,0,TAU);ctx.fill()}ctx.globalAlpha=1;
        const top=72,bottom=height-170,tg=ctx.createLinearGradient(cx-cr,0,cx+cr,0);tg.addColorStop(0,"#0b1e40");tg.addColorStop(.16,"#29548a");tg.addColorStop(.5,"#4c84b7");tg.addColorStop(.84,"#234878");tg.addColorStop(1,"#0a1937");ctx.fillStyle=tg;ctx.beginPath();ctx.ellipse(cx,top,cr,28,0,Math.PI,TAU);ctx.lineTo(cx+cr,bottom);ctx.ellipse(cx,bottom,cr,28,0,0,Math.PI);ctx.closePath();ctx.fill();ctx.strokeStyle="rgba(139,211,255,.22)";ctx.lineWidth=2;for(let y=top+45;y<bottom;y+=72){ctx.beginPath();ctx.ellipse(cx,y,cr,18,0,0,TAU);ctx.stroke()}
        const path=new Path2D();let first=true;for(let sy=bottom+20;sy>=top-20;sy-=4){const wy=g.distance+(ringY-sy),x=cx+cr*Math.sin(angleAt(g.nodes,wy));first?(path.moveTo(x,sy),first=false):path.lineTo(x,sy)}ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="rgba(57,255,216,.2)";ctx.lineWidth=19;ctx.stroke(path);ctx.strokeStyle="#55f7d5";ctx.shadowColor="#43ffdf";ctx.shadowBlur=14;ctx.lineWidth=5;ctx.stroke(path);ctx.shadowBlur=0;
        for(const p of g.pickups){if(p.collected)continue;const sy=ringY-(p.y-g.distance);if(sy<top-30||sy>bottom+30)continue;const x=cx+cr*Math.sin(angleAt(g.nodes,p.y)),pulse=1+Math.sin(time*.007)*.12;ctx.save();ctx.translate(x,sy);ctx.scale(pulse,pulse);ctx.fillStyle="#ffd447";ctx.shadowColor="#ffd447";ctx.shadowBlur=17;ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle="#fff5b7";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,5,0,TAU);ctx.stroke();ctx.restore()}
        const currentX=cx+cr*Math.sin(angleAt(g.nodes,g.distance)),ringX=cx+g.ringOffset,onPath=Math.abs(currentX-ringX)<=g.ringRadius*shapeWidth-6;ctx.strokeStyle=onPath?"#ffd447":"#ff5470";ctx.lineWidth=7;ctx.shadowColor=onPath?"#ffd447":"#ff3158";ctx.shadowBlur=18+g.flash*22;drawShape(ringX,ringY,g.ringRadius,shape,scale);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=onPath?"#fff3a5":"#ff8da0";ctx.beginPath();ctx.arc(ringX,ringY,4,0,TAU);ctx.fill();if(g.flash>0)g.flash=Math.max(0,g.flash-dt*2.6);
        if(started&&time-lastHud>90){lastHud=time;document.querySelector("#level").textContent=stage;document.querySelector("#ring").textContent=Math.round(g.ringRadius);document.querySelector("#speed").textContent=(g.speed/54).toFixed(1)+"×";document.querySelector("#score").textContent=Math.floor(g.score).toLocaleString();document.querySelector("#energy").style.width=Math.round(g.energy)+"%"}requestAnimationFrame(frame)}game=fresh();requestAnimationFrame(frame);
    </script>
  </body>
</html>
